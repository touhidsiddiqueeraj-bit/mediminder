version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The toolchain versions below must be upgraded together (Kotlin <->
      # KSP <-> Hilt <-> AGP <-> Room). Coordinate those bumps manually and
      # run the full build+test locally, as they regularly break each other.
      - dependency-name: "org.jetbrains.kotlin*"
        # Kotlin plugin + serialization plugin
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "com.google.dagger*"
      - dependency-name: "androidx.hilt*"
      - dependency-name: "com.android.application"
      - dependency-name: "androidx.room*"
      # Gradle 9+ requires a newer AGP; stay on 8.x until AGP is bumped.
      - dependency-name: "gradle"
        versions: [">=9.0.0"]
      # These AndroidX lines move to compileSdk 36 / newer Kotlin metadata;
      # re-enable after the coordinated toolchain upgrade.
      - dependency-name: "androidx.core*"
        versions: [">=1.16.0"]
      - dependency-name: "androidx.work*"
        versions: [">=2.10.0"]
      - dependency-name: "androidx.datastore*"
        versions: [">=1.2.0"]
      - dependency-name: "androidx.compose*"
        versions: [">=2025.01.00"]
      - dependency-name: "androidx.navigation*"
        versions: [">=2.9.0"]
      # OkHttp 5 / Retrofit 3 ship newer Kotlin metadata; Retrofit 3 is fine,
      # keep OkHttp on 4.x until the toolchain upgrade.
      - dependency-name: "com.squareup.okhttp3*"
        versions: [">=5.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
