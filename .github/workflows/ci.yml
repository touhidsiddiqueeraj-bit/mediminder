name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, unit tests & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          # Branch builds share the cache; PR builds only read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build, unit tests, lint, instrumented-test compile
        run: >
          ./gradlew :app:assembleDebug
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebugAndroidTest
          --stacktrace

      - name: Upload unit test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          if-no-files-found: ignore

      - name: Upload debug APK (for manual QA)
        uses: actions/upload-artifact@v7
        with:
          name: mediminder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
