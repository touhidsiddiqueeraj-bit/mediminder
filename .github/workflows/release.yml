name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create GitHub Releases

jobs:
  release:
    name: Build signed release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # True when the repository has signing secrets configured.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      # ------------------------------------------------------------------
      # Optional signing. Add these repository secrets to get a Play-ready
      # AAB; without them the release build falls back to debug signing so
      # the APK can still be installed for testing.
      #   KEYSTORE_BASE64   base64 of your .jks/.keystore file
      #   KEYSTORE_PASSWORD keystore password
      #   KEY_ALIAS         key alias
      #   KEY_PASSWORD      key password
      # ------------------------------------------------------------------
      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Write keystore.properties
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Upload artifacts (manual runs without a tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: mediminder-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
